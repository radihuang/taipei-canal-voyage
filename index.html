<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>台北運河漫遊｜Taipei Canal Voyage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 2D Floating Speech & Friend Labels Layer -->
  <div id="bubbles-layer"></div>
  <div id="treasure-layer"></div>

  <!-- Top HUD -->
  <header class="hud-top">
    <!-- Left: Progress & Boat Switcher -->
    <div class="glass-card status-panel">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">交友分數</span>
          <span class="stat-value" id="score-val">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-label">認識船友</span>
          <span class="stat-value" id="friends-val">0</span>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-text">
          <span id="next-tier-label">距離 5人帆船</span>
          <span id="next-tier-progress">0 / 30</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="passenger-status" id="passenger-status">
        <span class="passenger-count" id="passenger-count">🙋 升級帆船即可載客</span>
        <span class="passenger-dests" id="passenger-dests"></span>
      </div>

      <div class="panel-extras" id="panel-extras">
      <button class="collection-btn" id="collection-btn" type="button" aria-haspopup="dialog">
        📖 知識卡 <span id="collection-count">0 / 10</span>
      </button>

      <div class="boat-switcher" id="boat-switcher">
        <button class="boat-pill active" data-tier="0">
          <span class="pill-name">SUP</span>
          <span class="pill-cap">1人</span>
        </button>
        <button class="boat-pill locked" data-tier="1">
          <span class="pill-name">🔒 帆船</span>
          <span class="pill-cap">5人</span>
        </button>
        <button class="boat-pill locked" data-tier="2">
          <span class="pill-name">🔒 海盜船</span>
          <span class="pill-cap">10人</span>
        </button>
      </div>
      </div>

      <button class="panel-toggle" id="panel-toggle" type="button" aria-controls="panel-extras" aria-expanded="true">收起知識卡與船 ▴</button>
    </div>

    <!-- Right: Time of Day & Minimap -->
    <div class="right-column">
      <div class="glass-card time-panel" id="time-selector">
        <button class="time-btn" data-time="dawn" type="button" title="清晨" aria-label="清晨"><span aria-hidden="true">🌅</span></button>
        <button class="time-btn active" data-time="noon" type="button" title="正午" aria-label="正午"><span aria-hidden="true">☀️</span></button>
        <button class="time-btn" data-time="sunset" type="button" title="夕陽" aria-label="夕陽"><span aria-hidden="true">🌇</span></button>
        <button class="time-btn" data-time="night" type="button" title="夜晚" aria-label="夜晚"><span aria-hidden="true">🌙</span></button>
      </div>

      <div class="glass-card minimap-card">
        <canvas id="minimap" width="288" height="288"></canvas>
        <div class="location-tag" id="location-tag">大安水岸</div>
      </div>
    </div>
  </header>

  <!-- Toast / Upgrade Banner -->
  <div id="toast-container"></div>

  <!-- 送達知識卡 -->
  <aside class="knowledge-card glass-card hidden" id="knowledge-card" aria-live="polite">
    <button class="knowledge-close" id="knowledge-close" type="button" aria-label="關閉知識卡">×</button>
    <div class="knowledge-eyebrow" id="knowledge-eyebrow"></div>
    <img class="knowledge-image hidden" id="knowledge-image" alt="" width="96" height="96" />
    <h3 class="knowledge-title" id="knowledge-title"></h3>
    <p class="knowledge-body" id="knowledge-body"></p>
    <ul class="knowledge-sources" id="knowledge-sources"></ul>
  </aside>

  <!-- 知識卡收藏冊 -->
  <div class="collection-overlay hidden" id="collection-overlay">
    <section class="collection-panel glass-card" role="dialog" aria-modal="true" aria-labelledby="collection-heading">
      <button class="knowledge-close" id="collection-close" type="button" aria-label="關閉收藏冊">×</button>
      <h2 class="collection-heading" id="collection-heading">知識卡收藏冊</h2>
      <div class="collection-progress" id="collection-progress"></div>
      <div class="collection-grid" id="collection-grid"></div>
      <div class="collection-detail hidden" id="collection-detail">
        <button class="collection-back" id="collection-back" type="button">← 回收藏冊</button>
        <img class="knowledge-image hidden" id="collection-detail-image" alt="" width="96" height="96" />
        <h3 class="knowledge-title" id="collection-detail-title"></h3>
        <p class="knowledge-body" id="collection-detail-body"></p>
        <ul class="knowledge-sources" id="collection-detail-sources"></ul>
      </div>
      <div class="collection-footer" id="collection-footer">
        <button class="collection-clear" id="collection-clear" type="button">清空收藏</button>
      </div>
    </section>
  </div>

  <!-- Passenger Mode Banner -->
  <div class="passenger-banner hidden" id="passenger-banner">
    <span id="passenger-text">正在搭乘 船友 的船（你的橘船已暫時收起）</span>
  </div>

  <!-- Interaction Prompt Bar -->
  <div class="interact-bar hidden" id="interact-bar">
    <div class="nearby-info">
      <span class="nearby-badge" id="nearby-boat-type">帆船</span>
      <span class="nearby-name" id="nearby-name">大安咖啡師小魚</span>
    </div>
    <div class="interact-hint" id="interact-hint">按 Space 交朋友 · 按 E 登船</div>
  </div>

  <!-- Mobile & Quick Action Controls -->
  <div class="controls-layer">
    <!-- Virtual Joystick (Bottom Left) -->
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
    </div>

    <!-- Action Buttons (Bottom Right) -->
    <div class="action-buttons">
      <button class="action-btn btn-greet" id="btn-greet" disabled>
        <span class="btn-icon">👋</span>
        <span class="btn-label">交朋友</span>
        <span class="key-cap">Space</span>
      </button>
      <button class="action-btn btn-board" id="btn-board" disabled>
        <span class="btn-icon" id="board-icon">⛵</span>
        <span class="btn-label" id="board-label">搭便車</span>
        <span class="key-cap">E</span>
      </button>
    </div>
  </div>

  <!-- Welcome Overlay -->
  <div class="welcome-overlay" id="welcome-overlay">
    <div class="welcome-card">
      <div class="welcome-eyebrow">TAIPEI CANAL VOYAGE</div>
      <h1>台北運河漫遊</h1>
      <p class="welcome-desc">
        當忠孝、仁愛、信義、敦化化為靜謐運河。<br />
        划著你的橘色小船穿梭在幾何台北，結識岸邊與河道上的船友，從單人 SUP 升級至五人帆船與十人海盜船，也能隨時收起自己的船，跳上別人的甲板一起看夕陽。
      </p>
      <div class="welcome-choices" id="welcome-choices">
        <button class="guide-btn" id="guide-btn" type="button">登船須知</button>
        <button class="start-btn" id="start-btn" type="button">登船啟航</button>
      </div>
      <!-- 登船須知：一次一步，內容在 js/ui.js 的 GUIDE_STEPS -->
      <div class="guide hidden" id="guide" aria-live="polite">
        <div class="guide-progress" id="guide-progress"></div>
        <div class="guide-icon" id="guide-icon" aria-hidden="true"></div>
        <h2 class="guide-title" id="guide-title"></h2>
        <p class="guide-text" id="guide-text"></p>
        <div class="guide-dots" id="guide-dots" aria-hidden="true"></div>
        <div class="guide-nav">
          <button class="guide-prev" id="guide-prev" type="button">上一步</button>
          <button class="guide-next" id="guide-next" type="button">下一步</button>
        </div>
        <button class="guide-skip" id="guide-skip" type="button">直接登船啟航</button>
      </div>
    </div>
  </div>

  <!-- iPhone 整頁被放大時才出現 -->
  <button class="zoom-reset hidden" id="zoom-reset" type="button">還原畫面大小</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
